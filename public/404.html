<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <title>重定向中…</title>
    <script>
      // GitHub Pages 是纯静态托管，刷新 /about 这类子路由会返回 404。
      // 这里把路径暂存到 sessionStorage，再交回给 index.html 由路由接管。
      (function () {
        var path = window.location.pathname
        // 去掉仓库名前缀，还原成应用内部的真实路径
        var base = '/my-fullstack-journey'
        if (path.indexOf(base) === 0) {
          path = path.slice(base.length)
        }
        sessionStorage.setItem('redirect', path + window.location.search + window.location.hash)
        window.location.replace(base + '/')
      })()
    </script>
  </head>
  <body></body>
</html>
